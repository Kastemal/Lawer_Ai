services:
  psb_assistant:
    build: .
    container_name: psb_legal_assistant
    ports:
      - "8000:8000"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-deepseek/deepseek-v4.1-flash}
      - EMB_MODEL=${EMB_MODEL:-baai/bge-m3}
      - RERANKER_MODEL=${RERANKER_MODEL:-qwen/qwen3-reranker-8b}
      - DATA_DIR=data
      - TEMPERATURE=0.0
      - MAX_WORKERS=3
    restart: unless-stopped
